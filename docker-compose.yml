version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: vc-mongo
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]

  api:
    build: ./server
    container_name: vc-api
    restart: unless-stopped
    depends_on: [mongo]
    environment:
      MONGO_URI: mongodb://mongo:27017/virtual_classroom
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CLIENT_ORIGIN: http://localhost:5173
      PORT: 5000
    ports: ["5000:5000"]
    volumes: ["uploads:/app/uploads"]

volumes:
  mongo-data:
  uploads:
